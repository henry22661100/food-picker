<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什麼？｜美食抽籤神器</title>
<style>
:root{--cream:#fffaf0;--paper:#fffdf8;--orange:#f28b45;--orange-dark:#d96c27;--yellow:#ffd76a;--ink:#3f352d;--muted:#8d8176;--line:#f0e4d4;--pink:#ffe3dc;--green:#dcebd7;--shadow:0 16px 40px rgba(104,72,40,.09)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 10% 5%,#fff0d8 0,transparent 26%),radial-gradient(circle at 95% 25%,#ffe8df 0,transparent 25%),var(--cream);color:var(--ink);font-family:ui-rounded,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer;border:0;transition:transform .15s,filter .15s,box-shadow .15s}
button:hover{filter:brightness(.98);transform:translateY(-1px)}
button:active{transform:translateY(1px)}
.wrap{width:min(1100px,92%);margin:0 auto;padding:28px 0 42px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:16px;background:var(--yellow);display:grid;place-items:center;font-size:26px;box-shadow:0 5px 0 #f1bd4f}
.brand h1{font-size:clamp(20px,3vw,28px);margin:0;letter-spacing:.5px}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.header-pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;color:var(--muted);white-space:nowrap}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:stretch}
.panel{background:rgba(255,253,248,.93);border:1px solid rgba(240,228,212,.9);border-radius:28px;box-shadow:var(--shadow)}
.draw-panel{padding:clamp(22px,4vw,38px);position:relative;overflow:hidden}
.eyebrow{display:inline-flex;align-items:center;gap:7px;background:#fff0d9;color:#a75b27;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800}
h2{font-size:clamp(28px,4vw,42px);line-height:1.2;margin:17px 0 10px;letter-spacing:-1px}
.sub{color:var(--muted);line-height:1.7;margin:0}
.food-stage{margin:25px 0 18px;min-height:205px;border-radius:24px;background:linear-gradient(135deg,#fff1cf,#ffe7dc);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;position:relative;border:1px dashed #f3c99c}
.food-emoji{font-size:76px;line-height:1.2;filter:drop-shadow(0 8px 5px rgba(106,70,32,.12));animation:bob 2.2s ease-in-out infinite}
.food-name{font-size:26px;font-weight:900;margin-top:8px}
.food-hint{font-size:13px;color:#927760;margin-top:5px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.result .food-emoji{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg);opacity:.2}70%{transform:scale(1.12) rotate(5deg)}100%{transform:scale(1);opacity:1}}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,.text-input{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 13px;background:#fff;color:var(--ink);outline:none}
select:focus,.text-input:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f28b4520}
.primary{background:var(--orange);color:#fff;font-weight:900;border-radius:15px;padding:14px 18px;box-shadow:0 5px 0 #d96c27;font-size:16px}
.primary:hover{box-shadow:0 6px 0 #d96c27}
.secondary{background:#fff0d9;color:#a75b27;border-radius:13px;padding:11px 14px;font-weight:800}
.ghost{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:13px;padding:10px 13px}
.full{grid-column:1/-1}
.side{padding:23px;display:flex;flex-direction:column;gap:16px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-head h3{margin:0;font-size:18px}
.small-count{font-size:12px;color:var(--muted);background:#f8f1e8;padding:5px 9px;border-radius:999px}
.add-row{display:flex;gap:8px}
.add-row .text-input{min-width:0}
.category-note{font-size:12px;color:var(--muted);margin-top:-7px}
.quick-add{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px;color:#7d6c5d}
.chip:hover{background:#fff1df}
.divider{height:1px;background:var(--line);margin:0}
.food-list{display:flex;flex-wrap:wrap;gap:8px;max-height:140px;overflow:auto;padding:1px}
.food-tag{display:flex;align-items:center;gap:6px;background:#f8f2e9;border-radius:12px;padding:7px 9px;font-size:13px}
.food-tag button{background:transparent;color:#aa9480;padding:0 2px;font-size:16px}
.lower{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.lower-panel{padding:22px}
.history-list{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.history-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #f3eadf;border-radius:14px;padding:10px 12px}
.history-emoji{font-size:25px}
.history-name{font-weight:800;flex:1}
.history-time{font-size:11px;color:var(--muted)}
.empty{color:#a99b8c;text-align:center;padding:20px 8px;font-size:13px;background:#fffaf3;border-radius:14px;margin-top:13px}
.fav-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fav-chip{display:flex;align-items:center;gap:6px;background:#fff0ed;border:1px solid #ffddd4;border-radius:12px;padding:8px 10px;font-size:13px}
.fav-chip button{background:transparent;color:#d77c68;font-size:15px;padding:0}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:18px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#3f352d;color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 25px #0002;z-index:5}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:absolute;top:10px;right:15px;font-size:22px;opacity:.7}
@media(max-width:760px){.hero,.lower{grid-template-columns:1fr}.side{order:2}.draw-panel{order:1}header{align-items:flex-start}.header-pill{font-size:11px;padding:8px 10px}.food-stage{min-height:185px}.wrap{padding-top:18px}}
@media(max-width:420px){.controls{grid-template-columns:1fr}.full{grid-column:auto}.brand p{font-size:11px}.header-pill{display:none}.draw-panel{padding:20px}.side,.lower-panel{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">🍜</div>
      <div><h1>今天吃什麼？</h1><p>選擇困難症的美食救星</p></div>
    </div>
    <div class="header-pill">✨ 讓今天的美食交給運氣</div>
  </header>

  <main>
    <section class="hero">
      <div class="panel draw-panel">
        <span class="eyebrow">🎲 FOOD RANDOMIZER</span>
        <h2>肚子餓了？<br>讓我幫你決定！</h2>
        <p class="sub">不用再問「隨便」到底是什麼，按一下就有答案！</p>
        <div class="food-stage" id="foodStage">
          <span class="confetti">✦ ✧</span>
          <div class="food-emoji" id="foodEmoji">🍱</div>
          <div class="food-name" id="foodName">今天要吃什麼呢？</div>
          <div class="food-hint" id="foodHint">選好類別，按下抽籤開始！</div>
        </div>
        <div class="controls">
          <select id="category" aria-label="選擇餐點類別">
            <option value="全部">🍽️ 全部餐點</option>
            <option value="早餐">🌤️ 早餐</option>
            <option value="午餐">☀️ 午餐</option>
            <option value="晚餐">🌙 晚餐</option>
            <option value="點心">🍰 點心</option>
          </select>
          <button class="secondary" id="favCurrent">♡ 收藏這一餐</button>
          <button class="primary full" id="drawBtn">🎲 幫我抽一個！</button>
          <button class="ghost" id="drawAgain">再抽一次 ↻</button>
          <button class="ghost" id="resetBtn">恢復預設餐點</button>
        </div>
      </div>

      <aside class="panel side">
        <div class="section-head"><h3>🥢 我的美食清單</h3><span class="small-count" id="foodCount">0 道餐點</span></div>
        <div class="add-row">
          <input class="text-input" id="foodInput" maxlength="24" placeholder="例如：咖哩飯、滷肉飯…" aria-label="新增餐點名稱">
          <select id="newCategory" aria-label="新增餐點類別" style="max-width:105px">
            <option value="午餐">午餐</option><option value="早餐">早餐</option><option value="晚餐">晚餐</option><option value="點心">點心</option>
          </select>
        </div>
        <button class="primary" id="addBtn">＋ 加入我的清單</button>
        <div class="category-note">也可以試試下面的熱門餐點，一鍵加入清單！</div>
        <div class="quick-add" id="quickAdd"></div>
        <div class="divider"></div>
        <div class="section-head"><h3>📋 已加入的餐點</h3><button class="ghost" id="clearFoods" style="padding:6px 9px;font-size:12px">清空清單</button></div>
        <div class="food-list" id="foodList"></div>
      </aside>
    </section>

    <section class="lower">
      <div class="panel lower-panel">
        <div class="section-head"><h3>🕘 最近抽過</h3><button class="ghost" id="clearHistory" style="padding:6px 9px;font-size:12px">清除紀錄</button></div>
        <div class="history-list" id="historyList"></div>
      </div>
      <div class="panel lower-panel">
        <div class="section-head"><h3>💖 我的最愛</h3><span class="small-count" id="favCount">0 個收藏</span></div>
        <div class="fav-list" id="favList"></div>
      </div>
    </section>
  </main>
  <p class="note">小提醒：你的餐點清單和收藏會保存在這台裝置的瀏覽器中。<br>今天也要好好吃飯喔！♡</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const defaults = [
  {name:"滷肉飯",category:"午餐",emoji:"🍚"},{name:"牛肉麵",category:"午餐",emoji:"🍜"},
  {name:"雞腿便當",category:"午餐",emoji:"🍱"},{name:"鍋燒意麵",category:"晚餐",emoji:"🍲"},
  {name:"壽司",category:"晚餐",emoji:"🍣"},{name:"火鍋",category:"晚餐",emoji:"🥘"},
  {name:"蛋餅",category:"早餐",emoji:"🥞"},{name:"飯糰",category:"早餐",emoji:"🍙"},
  {name:"漢堡",category:"午餐",emoji:"🍔"},{name:"水餃",category:"晚餐",emoji:"🥟"},
  {name:"咖哩飯",category:"午餐",emoji:"🍛"},{name:"義大利麵",category:"晚餐",emoji:"🍝"},
  {name:"鹽酥雞",category:"點心",emoji:"🍗"},{name:"珍珠奶茶",category:"點心",emoji:"🧋"},
  {name:"雞蛋糕",category:"點心",emoji:"🧇"},{name:"三明治",category:"早餐",emoji:"🥪"},
  {name:"豆漿＋燒餅",category:"早餐",emoji:"🥯"},{name:"拉麵",category:"晚餐",emoji:"🍜"}
];
const popular = [
  {name:"披薩",category:"晚餐",emoji:"🍕"},{name:"炸雞",category:"晚餐",emoji:"🍗"},
  {name:"臭豆腐",category:"點心",emoji:"🧈"},{name:"刈包",category:"午餐",emoji:"🥙"},
  {name:"可頌",category:"早餐",emoji:"🥐"},{name:"冰淇淋",category:"點心",emoji:"🍦"}
];
const emojiMap = {"滷肉飯":"🍚","牛肉麵":"🍜","雞腿便當":"🍱","鍋燒意麵":"🍲","壽司":"🍣","火鍋":"🥘","蛋餅":"🥞","飯糰":"🍙","漢堡":"🍔","水餃":"🥟","咖哩飯":"🍛","義大利麵":"🍝","鹽酥雞":"🍗","珍珠奶茶":"🧋","雞蛋糕":"🧇","三明治":"🥪","豆漿＋燒餅":"🥯","拉麵":"🍜","披薩":"🍕","炸雞":"🍗","臭豆腐":"🧈","刈包":"🥙","可頌":"🥐","冰淇淋":"🍦"};
const $ = id => document.getElementById(id);
function load(key,fallback){try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}}
let foods=load("foodPickerFoods",defaults.map(x=>({...x})));
let favorites=load("foodPickerFavorites",[]);
let history=load("foodPickerHistory",[]);
let current=null, toastTimer;
function save(){localStorage.setItem("foodPickerFoods",JSON.stringify(foods));localStorage.setItem("foodPickerFavorites",JSON.stringify(favorites));localStorage.setItem("foodPickerHistory",JSON.stringify(history))}
function showToast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2200)}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderFoods(){
  $("foodCount").textContent=`${foods.length} 道餐點`;
  $("foodList").innerHTML=foods.length?foods.map((f,i)=>`<span class="food-tag">${f.emoji} ${escapeHTML(f.name)}<button title="刪除${escapeHTML(f.name)}" aria-label="刪除${escapeHTML(f.name)}" data-remove="${i}">×</button></span>`).join(""):'<div class="empty" style="width:100%;margin:0">清單還是空的，新增幾道美食吧！</div>';
  $("foodList").querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{const i=+b.dataset.remove;const removed=foods.splice(i,1)[0];favorites=favorites.filter(n=>n!==removed.name);save();renderAll();showToast("已移除這道餐點")});
}
function renderFavorites(){
  $("favCount").textContent=`${favorites.length} 個收藏`;
  $("favList").innerHTML=favorites.length?favorites.map(name=>{const f=foods.find(x=>x.name===name)||defaults.find(x=>x.name===name)||{emoji:"🍽️"};return `<span class="fav-chip">${f.emoji} ${escapeHTML(name)} <button data-unfav="${escapeHTML(name)}" aria-label="取消收藏${escapeHTML(name)}">×</button></span>`}).join(""):'<div class="empty" style="width:100%">還沒有收藏，抽到喜歡的餐點就把它留下來吧！</div>';
  $("favList").querySelectorAll("[data-unfav]").forEach(b=>b.onclick=()=>{favorites=favorites.filter(n=>n!==b.dataset.unfav);save();renderFavorites();showToast("已取消收藏")});
}
function renderHistory(){
  $("historyList").innerHTML=history.length?history.slice(0,6).map(h=>`<div class="history-item"><span class="history-emoji">${h.emoji}</span><span class="history-name">${escapeHTML(h.name)}</span><span class="history-time">${escapeHTML(h.time)}</span></div>`).join(""):'<div class="empty">還沒抽過籤，第一道美食等你來決定！</div>';
}
function renderQuickAdd(){
  $("quickAdd").innerHTML=popular.map(f=>`<button class="chip" data-quick="${escapeHTML(f.name)}">＋ ${f.emoji} ${escapeHTML(f.name)}</button>`).join("");
  $("quickAdd").querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>{const f=popular.find(x=>x.name===b.dataset.quick);addFood(f.name,f.category,f.emoji)});
}
function renderAll(){renderFoods();renderFavorites();renderHistory();renderQuickAdd()}
function addFood(name,category,emoji){
  name=(name||"").trim();if(!name){showToast("先輸入餐點名稱喔！");$("foodInput").focus();return}
  if(foods.some(f=>f.name.toLowerCase()===name.toLowerCase())){showToast("這道餐點已經在清單裡了！");return}
  foods.push({name,category,emoji:emoji||emojiMap[name]||"🍽️"});save();renderFoods();$("foodInput").value="";showToast(`已加入「${name}」！`)
}
function draw(){
  const cat=$("category").value;
  let pool=foods.filter(f=>cat==="全部"||f.category===cat);
  if(!pool.length){showToast("這個類別還沒有餐點，先新增一些吧！");return}
  let candidates=pool;
  if(pool.length>1&&current){const withoutCurrent=pool.filter(f=>f.name!==current.name);if(withoutCurrent.length)candidates=withoutCurrent}
  const picked=candidates[Math.floor(Math.random()*candidates.length)];
  current=picked;
  $("foodEmoji").textContent=picked.emoji;$("foodName").textContent=picked.name;
  $("foodHint").textContent=`今天就決定吃「${picked.name}」！`; $("foodStage").classList.remove("result");void $("foodStage").offsetWidth;$("foodStage").classList.add("result");
  const now=new Date();const time=`${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  history.unshift({name:picked.name,emoji:picked.emoji,time});history=history.slice(0,12);save();renderHistory();showToast("抽籤完成！開動吧！😋")
}
$("drawBtn").onclick=draw;$("drawAgain").onclick=draw;
$("addBtn").onclick=()=>addFood($("foodInput").value,$("newCategory").value);
$("foodInput").addEventListener("keydown",e=>{if(e.key==="Enter")addFood($("foodInput").value,$("newCategory").value)});
$("favCurrent").onclick=()=>{if(!current){showToast("先抽出一道餐點再收藏吧！");return}if(favorites.includes(current.name)){showToast("這道已經在最愛裡囉！");return}favorites.push(current.name);save();renderFavorites();showToast("已加入我的最愛！💖")};
$("clearFoods").onclick=()=>{if(!foods.length){showToast("清單已經是空的囉");return}if(confirm("確定要清空所有餐點嗎？")){foods=[];favorites=[];current=null;save();renderAll();showToast("餐點清單已清空")}};
$("clearHistory").onclick=()=>{history=[];save();renderHistory();showToast("抽籤紀錄已清除")};
$("resetBtn").onclick=()=>{if(confirm("要恢復成預設餐點嗎？你目前的自訂餐點會被取代。")){foods=defaults.map(x=>({...x}));favorites=[];history=[];current=null;save();$("foodEmoji").textContent="🍱";$("foodName").textContent="今天要吃什麼呢？";$("foodHint").textContent="選好類別，按下抽籤開始！";renderAll();showToast("已恢復預設餐點")}};
renderAll();
</script>
</body>
</html>
